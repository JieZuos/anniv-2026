<!DOCTYPE html>
<html>
<head>
    <title>Palm Flower Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; z-index: 10; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <script>
        const video = document.getElementById('video');
        let scene, camera, renderer, bouquet;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            scene.add(new THREE.AmbientLight(0xffffff, 1.0));
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1.0);
            directionalLight.position.set(0, 1, 2);
            scene.add(directionalLight);

            // CORRECTED LOADER CALL
            const loader = new THREE.GLTFLoader(); 
            loader.load('bouquet.glb', (gltf) => {
                bouquet = gltf.scene;
                bouquet.scale.set(0.5, 0.5, 0.5); // Adjust if model is too big/small
                scene.add(bouquet);
            });

            camera.position.z = 2;
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && bouquet) {
                const landmarks = results.multiHandLandmarks[0];
                
                // Track the middle finger base for palm placement
                const palm = landmarks[9];
                const wrist = landmarks[0];
                const index = landmarks[5];
                const pinky = landmarks[17];

                // Map coordinates to 3D space
                bouquet.position.x = (palm.x - 0.5) * 4;
                bouquet.position.y = -(palm.y - 0.5) * 3;
                bouquet.position.z = -palm.z * 10;

                // Rotation calculation
                const v1 = new THREE.Vector3().subVectors(index, wrist);
                const v2 = new THREE.Vector3().subVectors(pinky, wrist);
                const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
                const forward = new THREE.Vector3().subVectors(palm, wrist).normalize();

                const matrix = new THREE.Matrix4();
                matrix.lookAt(new THREE.Vector3(0,0,0), forward, normal);
                bouquet.quaternion.setFromRotationMatrix(matrix);
                
                bouquet.visible = true;
            } else if (bouquet) {
                bouquet.visible = false;
            }
            renderer.render(scene, camera);
        }

        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.5, minTrackingConfidence: 0.5 });
        hands.onResults(onResults);

        const cam = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            facingMode: 'environment', // Rear camera
            width: 1280, height: 720
        });

        initThree();
        cam.start();
    </script>
</body>
</html>
