<!DOCTYPE html>
<html>
<head>
    <title>Palm Flower Tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #video { position: absolute; width: 100vw; height: 100vh; object-fit: cover; }
        canvas { position: absolute; top: 0; left: 0; }
    </style>
</head>
<body>
    <video id="video" autoplay playsinline></video>
    <script>
        const video = document.getElementById('video');
        let scene, camera, renderer, bouquet;

        function initThree() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            // 1. Lighting (Essential for GLB models to look good)
            const light = new THREE.DirectionalLight(0xffffff, 1.5);
            light.position.set(0, 1, 1).normalize();
            scene.add(light);
            scene.add(new THREE.AmbientLight(0xffffff, 0.8));

            // 2. Load the Bouquet from the same folder
            const loader = new THREE.THREE.GLTFLoader(); // Note the THREE. prefix for global scope
            loader.load('bouquet.glb', (gltf) => {
                bouquet = gltf.scene;
                bouquet.scale.set(0.2, 0.2, 0.2); // Adjust this based on model size
                scene.add(bouquet);
                console.log("Model Loaded!");
            }, undefined, (error) => {
                console.error("Error loading model:", error);
            });

            camera.position.z = 2;
        }

        function onResults(results) {
            if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0 && bouquet) {
                const landmarks = results.multiHandLandmarks[0];

                // Landmark 9 is the middle finger base (center of palm)
                const center = landmarks[9];
                const wrist = landmarks[0];
                const indexBase = landmarks[5];
                const pinkyBase = landmarks[17];

                // Update Position
                bouquet.position.x = (center.x - 0.5) * 4; 
                bouquet.position.y = -(center.y - 0.5) * 3;
                bouquet.position.z = -center.z * 10;

                // Update Rotation (Orientation)
                const v1 = new THREE.Vector3().subVectors(indexBase, wrist);
                const v2 = new THREE.Vector3().subVectors(pinkyBase, wrist);
                const normal = new THREE.Vector3().crossVectors(v1, v2).normalize();
                const forward = new THREE.Vector3().subVectors(center, wrist).normalize();

                const matrix = new THREE.Matrix4();
                matrix.lookAt(new THREE.Vector3(0,0,0), forward, normal);
                bouquet.quaternion.setFromRotationMatrix(matrix);
                
                bouquet.visible = true;
            } else if (bouquet) {
                bouquet.visible = false;
            }
            renderer.render(scene, camera);
        }

        // Setup MediaPipe
        const hands = new Hands({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`});
        hands.setOptions({ maxNumHands: 1, modelComplexity: 1, minDetectionConfidence: 0.6, minTrackingConfidence: 0.6 });
        hands.onResults(onResults);

        const cam = new Camera(video, {
            onFrame: async () => { await hands.send({image: video}); },
            facingMode: 'environment', // Rear Camera
            width: 1280, height: 720
        });

        initThree();
        cam.start();
    </script>
</body>
</html>
